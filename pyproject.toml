[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-browser-translation"
version = "1.0.0"

authors = [
  { name="Tatu Aalto", email="aalto.tatu@gmail.com" },
]
license = {file = "LICENSE"}
description = "Finnish and German translations for the Robot Framework Browser library"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Robot Framework :: Library",
  "Topic :: Software Development :: Testing :: Acceptance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
keywords = ["Robot Framework", "Browser"]

dependencies = [
    "robotframework-browser >= 20.4.0",
]

[project.urls]
Homepage = "https://github.com/MarketSquare/robotframework-browser-translation"
Issues = "https://github.com/MarketSquare/robotframework-browser-translation/issues"
Changelog = "https://github.com/MarketSquare/robotframework-browser-translation/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["robotframework_browser_translation"]

[tool.setuptools.package-data]
robotframework_browser_translation = ["*.json"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "robotframework_browser_translation/__init__.py:__version__",
]

[tool.ruff]
lint.unfixable = []
lint.select = [
  "E",
  "F",
  "W",
  "C90",
  "I",
  "N",
  "B",
  "PYI",
  "PL",
  "PTH",
  "UP",
  "A",
  "C4",
  "DTZ",
  "ISC",
  "ICN",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "RSE",
  "RET",
  "SIM",
  "RUF"
]
exclude = [
  "__pycache__",
]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tasks.py" = ["T201"]
"utest/*" = ["INP001"]
"atest/*" = ["INP001"]

[tool.pytest.ini_options]
testpaths = ["utest"]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.robocop.format]
line_ending = "unix"
configure = [
    "NormalizeAssignments.equal_sign_type=space_and_equal_sign",
    "NormalizeAssignments.equal_sign_type_variables=space_and_equal_sign",
    "NormalizeNewLines.section_lines=1",
    "RenameTestCases.enabled=True",
    "RenameTestCases.capitalize_each_word=True",
    "RenameKeywords.enabled=True",
]

[tool.mypy]
exclude = [
  "utest/*",
]
